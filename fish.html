<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>דג באקווריום - Noam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="aquarium-game">
      <h1>דג באקווריום 🐠</h1>
      <div class="aq-stats">
        <span class="stat">ניקוד: <b id="score">0</b></span>
      </div>

      <div class="canvas-wrap">
        <canvas id="aquarium"></canvas>
        <div class="fish-hint hidden" id="fishHint">לחץ על הדג כדי להפוך לדג 🐟</div>
        <div class="game-overlay" id="overlay">
          <div class="overlay-card">
            <h2 id="overlayTitle">שחק! 🐟</h2>
            <p id="overlayMsg">הזז/י את העכבר או האצבע כדי לשחות. אכל אוכל 🍤, אסוף מטבעות 🪙, והיזהר מהמדוזות 🪼!<br>לחץ על הדג כדי לראות מעיניו.</p>
            <button class="btn" id="startBtn" type="button">התחל</button>
          </div>
        </div>
      </div>

      <div class="game-controls">
        <button class="btn" id="restart" type="button">התחל מחדש</button>
        <a href="index.html" class="btn btn-secondary">חזרה לדף הבית</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Noam</p>
  </footer>

  <script src="coins.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      const canvas = document.getElementById('aquarium');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayMsg = document.getElementById('overlayMsg');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restart');
      const scoreEl = document.getElementById('score');
      const fishHint = document.getElementById('fishHint');

      let W = 600, H = 450, DPR = 1;
      let player, foods, coins, hazards, bubbles, seaweeds, particles, snow, pebbles;
      let score = 0, running = false, lastTime = 0, t = 0;
      let foodTimer = 0, coinTimer = 0, hazTimer = 0;
      let camMode = 'full'; // 'full' או 'fish' (תצפית מעיני הדג)
      const pointer = { x: 300, y: 225 };

      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
      function lerpAngle(a, b, t) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * t; }

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.getBoundingClientRect();
        W = rect.width || 600;
        H = rect.height || 450;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function makeBubble(any) {
        return { x: Math.random() * W, y: any ? Math.random() * H : H + 10, r: 2 + Math.random() * 5, s: 0.3 + Math.random() * 0.6 };
      }

      function setup() {
        resize();
        player = { x: W / 2, y: H / 2, size: 18, dir: 1, vx: 0, vy: 0, heading: 0 };
        foods = []; coins = []; hazards = []; particles = [];
        bubbles = [];
        for (let i = 0; i < 14; i++) bubbles.push(makeBubble(true));
        seaweeds = [];
        for (let i = 0; i < 5; i++) seaweeds.push({ x: (i + 0.5) / 5 * W, h: 50 + Math.random() * 90, phase: Math.random() * Math.PI * 2 });
        snow = [];
        for (let i = 0; i < 26; i++) snow.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.4, vx: -0.15 + Math.random() * 0.06, vy: 0.08 + Math.random() * 0.22 });
        pebbles = [];
        for (let i = 0; i < 46; i++) pebbles.push({ x: Math.random() * W, y: H - 20 + Math.random() * 18, r: 1 + Math.random() * 2.2, c: Math.random() < 0.5 ? '#a9823f' : '#c9a063' });
        score = 0; updateScoreUI();
        camMode = 'full';
        foodTimer = 500; coinTimer = 5000; hazTimer = 4000;
        pointer.x = W / 2; pointer.y = H / 2;
      }

      function updateScoreUI() { scoreEl.textContent = score; }

      function updateHint() {
        if (!running) { fishHint.classList.add('hidden'); return; }
        fishHint.classList.remove('hidden');
        fishHint.textContent = (camMode === 'fish')
          ? 'אתה הדג! לחץ במרכז כדי לצאת 🐟'
          : 'לחץ על הדג כדי לראות מעיניו 🐟';
      }

      function toggleCam() {
        if (camMode === 'full') {
          camMode = 'fish';
          player.heading = player.dir > 0 ? 0 : Math.PI;
          pointer.x = W / 2; pointer.y = H / 2;
        } else {
          camMode = 'full';
          pointer.x = player.x; pointer.y = player.y;
        }
        updateHint();
      }

      /* יצירת אובייקטים */
      function spawnFood() { foods.push({ x: 20 + Math.random() * (W - 40), y: -10, vy: 0.4 + Math.random() * 0.5, r: 6 }); }
      function spawnCoin() { coins.push({ x: 30 + Math.random() * (W - 60), y: 30 + Math.random() * (H - 60), bob: Math.random() * Math.PI * 2, life: 8000, collected: false }); }
      function spawnHazard() {
        const fromLeft = Math.random() < 0.5;
        const r = 18 + Math.random() * 10;
        hazards.push({ x: fromLeft ? -r : W + r, y: 40 + Math.random() * (H - 120), vx: (fromLeft ? 1 : -1) * (0.5 + Math.random() * 0.6), vy: (Math.random() - 0.5) * 0.4, r: r, phase: Math.random() * Math.PI * 2 });
      }

      function addBurst(x, y, color) {
        for (let i = 0; i < 8; i++) {
          const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 2.5;
          particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 400, color: color, r: 2 + Math.random() * 2 });
        }
      }

      // ערפל צלילות - ראות מוגבלת מתחת למים
      function fogOf(x, y) {
        if (camMode !== 'fish') return 1;
        const d = Math.hypot(x - player.x, y - player.y);
        return clamp(1 - d / 250, 0.22, 1);
      }

      function updateSnow(dt) {
        for (const s of snow) {
          s.x += s.vx * (dt / 16); s.y += s.vy * (dt / 16);
          if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
          if (s.x < -2) s.x = W + 2; if (s.x > W + 2) s.x = -2;
        }
      }

      function update(dt) {
        // יעד תנועה לפי מצב מצלמה
        let tx, ty;
        if (camMode === 'fish') {
          let sx = pointer.x - W / 2, sy = pointer.y - H / 2;
          const mag = Math.hypot(sx, sy), max = 80;
          if (mag > max) { sx = sx / mag * max; sy = sy / mag * max; }
          tx = player.x + sx; ty = player.y + sy;
        } else {
          tx = pointer.x; ty = pointer.y;
        }
        const dx = tx - player.x, dy = ty - player.y;
        const k = 0.14;
        player.x += dx * k * (dt / 16);
        player.y += dy * k * (dt / 16);
        if (Math.abs(dx) > 2) player.dir = dx > 0 ? 1 : -1;
        // כיוון מבט חלק (לסיבוב התצפית)
        if (Math.hypot(dx, dy) > 3) player.heading = lerpAngle(player.heading, Math.atan2(dy, dx), 0.18);
        player.x = clamp(player.x, player.size, W - player.size);
        player.y = clamp(player.y, player.size, H - player.size);

        // טיימרים
        foodTimer -= dt;
        if (foodTimer <= 0) { spawnFood(); foodTimer = 650 + Math.random() * 900; }
        coinTimer -= dt;
        if (coinTimer <= 0) { spawnCoin(); coinTimer = 6000 + Math.random() * 5000; }
        hazTimer -= dt;
        if (hazTimer <= 0 && hazards.length < 2) { spawnHazard(); hazTimer = 6000 + Math.random() * 5000; }

        for (const f of foods) f.y += f.vy * (dt / 16);
        foods = foods.filter(f => f.y < H + 20 && !f.eaten);

        for (const c of coins) { c.bob += 0.06; c.life -= dt; }
        coins = coins.filter(c => c.life > 0 && !c.collected);

        for (const h of hazards) { h.x += h.vx * (dt / 16); h.y += h.vy * (dt / 16); h.phase += 0.03; }
        hazards = hazards.filter(h => h.x > -60 && h.x < W + 60 && h.y > -60 && h.y < H + 60);

        // אכילה
        for (const f of foods) {
          if (!f.eaten && Math.hypot(f.x - player.x, f.y - player.y) < player.size + f.r) {
            f.eaten = true; score++; player.size = Math.min(34, player.size + 0.35);
            addBurst(f.x, f.y, '#ffcc66'); updateScoreUI();
          }
        }
        // מטבעות
        for (const c of coins) {
          if (!c.collected && Math.hypot(c.x - player.x, c.y - player.y) < player.size + 10) {
            c.collected = true;
            if (window.NoamCoins) window.NoamCoins.add(1);
            addBurst(c.x, c.y, '#fbbf24');
          }
        }
        // מדוזות
        for (const h of hazards) {
          if (Math.hypot(h.x - player.x, h.y - player.y) < player.size + h.r * 0.6) {
            endGame(); break;
          }
        }

        // בועות
        for (const b of bubbles) { b.y -= b.s * (dt / 16); b.x += Math.sin(b.y * 0.02) * 0.3; }
        bubbles = bubbles.filter(b => b.y > -10);
        if (Math.random() < 0.04) bubbles.push(makeBubble(false));

        // חלקיקים
        for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= dt; }
        particles = particles.filter(p => p.life > 0);

        updateSnow(dt);
      }

      /* ===== ציור רקע ריאליסטי ===== */
      function drawWater() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#0e4a72'); g.addColorStop(0.5, '#0a3a5e'); g.addColorStop(1, '#063048');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        // ברק פני שטח
        ctx.save(); ctx.globalAlpha = 0.12; ctx.strokeStyle = '#bfe6ff'; ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          const y = 8 + i * 6;
          ctx.beginPath(); ctx.moveTo(0, y);
          for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.05 + t * 0.001 + i) * 2);
          ctx.stroke();
        }
        ctx.restore();
        // קרני אור
        ctx.save(); ctx.globalAlpha = 0.06; ctx.fillStyle = '#aee0ff';
        for (let i = 0; i < 3; i++) {
          const x = (i + 0.5) / 3 * W + Math.sin(t * 0.0005 + i) * 20;
          ctx.beginPath();
          ctx.moveTo(x - 20, 0); ctx.lineTo(x + 20, 0); ctx.lineTo(x + 60, H); ctx.lineTo(x - 60, H); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }

      function dune(x) { return Math.sin(x * 0.03) * 3 + Math.sin(x * 0.013 + 1.3) * 5; }

      function drawPebble(p) {
        const g = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.1, p.x, p.y, p.r);
        g.addColorStop(0, '#e6c98a'); g.addColorStop(1, p.c);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }

      // קרקעית תלת-מימדית: דיונות + הצללת עומק + דעיכה למים
      function drawSand() {
        const top = H - 22;
        ctx.beginPath();
        ctx.moveTo(0, H); ctx.lineTo(0, top + dune(0));
        for (let x = 16; x <= W; x += 16) ctx.lineTo(x, top + dune(x));
        ctx.lineTo(W, H); ctx.closePath();
        ctx.fillStyle = '#b8924f'; ctx.fill();
        ctx.save(); ctx.clip();
        const g = ctx.createLinearGradient(0, top, 0, H);
        g.addColorStop(0, 'rgba(232,205,140,0.95)'); g.addColorStop(0.45, 'rgba(160,120,60,0)'); g.addColorStop(1, 'rgba(35,22,8,0.6)');
        ctx.fillStyle = g; ctx.fillRect(0, top, W, H - top + 4);
        const f = ctx.createLinearGradient(0, top, 0, H - 6);
        f.addColorStop(0, 'rgba(10,58,94,0.75)'); f.addColorStop(0.5, 'rgba(10,58,94,0)');
        ctx.fillStyle = f; ctx.fillRect(0, top, W, 12);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,235,180,0.25)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, top + dune(0));
        for (let x = 16; x <= W; x += 16) ctx.lineTo(x, top + dune(x));
        ctx.stroke();
      }

      function drawSeaweed(s) {
        const baseY = H - 14, tipY = baseY - s.h, w = 5;
        const pts = [];
        for (let k = 0; k <= 6; k++) { const tk = k / 6; pts.push({ yy: baseY - tk * s.h, sway: Math.sin(s.phase + k * 0.6) * 8, wd: w * (1 - tk * 0.85) }); }
        ctx.beginPath();
        ctx.moveTo(s.x - pts[0].wd, pts[0].yy);
        for (let k = 1; k <= 6; k++) ctx.lineTo(s.x - pts[k].wd + pts[k].sway, pts[k].yy);
        for (let k = 6; k >= 0; k--) ctx.lineTo(s.x + pts[k].wd + pts[k].sway, pts[k].yy);
        ctx.closePath();
        const g = ctx.createLinearGradient(s.x, baseY, s.x, tipY);
        g.addColorStop(0, '#155a2a'); g.addColorStop(0.6, '#1f7a3a'); g.addColorStop(1, '#3aa85a');
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = 'rgba(140,230,170,0.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(s.x - pts[0].wd * 0.5, pts[0].yy);
        for (let k = 1; k <= 6; k++) ctx.lineTo(s.x - pts[k].wd * 0.5 + pts[k].sway, pts[k].yy);
        ctx.stroke();
        s.phase += 0.012;
      }

      function drawBubble(b) {
        const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.2, b.x, b.y, b.r);
        g.addColorStop(0, 'rgba(255,255,255,0.05)'); g.addColorStop(0.7, 'rgba(200,230,255,0.08)');
        g.addColorStop(0.92, 'rgba(220,240,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0.05)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(220,240,255,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.2, 0, Math.PI * 2); ctx.fill();
      }

      // אוכל תלת-מימדי
      function drawFood(f) {
        const r = f.r;
        const g = ctx.createRadialGradient(f.x - r * 0.35, f.y - r * 0.35, r * 0.15, f.x, f.y, r);
        g.addColorStop(0, '#fff2bf'); g.addColorStop(0.45, '#ffcc66'); g.addColorStop(1, '#b97a23');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath(); ctx.arc(f.x - r * 0.3, f.y - r * 0.3, r * 0.22, 0, Math.PI * 2); ctx.fill();
      }

      // מטבע תלת-מימדי
      function drawCoin(c, fog) {
        const yy = c.y + Math.sin(c.bob) * 3;
        const fade = c.life < 1500 ? c.life / 1500 : 1;
        ctx.globalAlpha = fade * fog;
        const r = 9;
        const g = ctx.createRadialGradient(c.x - r * 0.3, yy - r * 0.3, r * 0.15, c.x, yy, r);
        g.addColorStop(0, '#fff3b0'); g.addColorStop(0.5, '#fbbf24'); g.addColorStop(1, '#b8860b');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(c.x, yy, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(c.x, yy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,240,180,0.85)';
        ctx.beginPath(); ctx.arc(c.x - r * 0.3, yy - r * 0.3, r * 0.26, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawHazard(h) {
        const r = h.r;
        const g = ctx.createRadialGradient(h.x - r * 0.2, h.y - r * 0.5, r * 0.2, h.x, h.y, r);
        g.addColorStop(0, 'rgba(220,200,255,0.9)'); g.addColorStop(0.6, 'rgba(167,139,250,0.85)'); g.addColorStop(1, 'rgba(120,90,200,0.8)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(h.x, h.y, r, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = 'rgba(235,220,255,0.6)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, r, Math.PI, 0); ctx.stroke();
        ctx.strokeStyle = 'rgba(167,139,250,0.7)'; ctx.lineWidth = 2.5;
        for (let i = -2; i <= 2; i++) {
          const tx = h.x + i * r * 0.32;
          ctx.beginPath(); ctx.moveTo(tx, h.y);
          for (let k = 1; k <= 4; k++) {
            const yy = h.y + k * r * 0.3;
            const xx = tx + Math.sin(h.phase + i + k) * 4;
            ctx.lineTo(xx, yy);
          }
          ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(h.x - r * 0.3, h.y - r * 0.2, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(h.x + r * 0.3, h.y - r * 0.2, 2, 0, Math.PI * 2); ctx.fill();
      }

      function drawFish(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.dir, 1);
        const s = p.size;
        const wig = Math.sin(t * 0.02) * s * 0.18;
        ctx.fillStyle = '#ff6b1a';
        ctx.beginPath();
        ctx.moveTo(-s * 0.8, 0);
        ctx.lineTo(-s * 1.6, -s * 0.5 + wig);
        ctx.lineTo(-s * 1.5, 0);
        ctx.lineTo(-s * 1.6, s * 0.5 + wig);
        ctx.closePath(); ctx.fill();
        const g = ctx.createRadialGradient(s * 0.3, -s * 0.2, s * 0.1, 0, 0, s);
        g.addColorStop(0, '#ffb070'); g.addColorStop(0.6, '#ff8c42'); g.addColorStop(1, '#d96820');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.62, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd29c';
        ctx.beginPath(); ctx.ellipse(0, s * 0.2, s * 0.7, s * 0.35, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff6b1a';
        ctx.beginPath(); ctx.ellipse(-s * 0.1, -s * 0.45, s * 0.35, s * 0.18, -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s * 0.5, -s * 0.12, s * 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#113355';
        ctx.beginPath(); ctx.arc(s * 0.56, -s * 0.12, s * 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawParticle(p) {
        ctx.globalAlpha = Math.max(p.life / 400, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      // שכבות אווירה במסך (תצפית מעיני הדג)
      function drawSnow() {
        ctx.fillStyle = 'rgba(190,225,235,0.4)';
        for (const s of snow) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
      }
      function drawVignette() {
        const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.25, W / 2, H * 0.5, Math.max(W, H) * 0.75);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(2,18,32,0.6)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
      function drawSnout() {
        const g = ctx.createRadialGradient(W / 2, H, 20, W / 2, H, H * 0.7);
        g.addColorStop(0, 'rgba(217,104,32,0.45)'); g.addColorStop(0.35, 'rgba(217,104,32,0.15)'); g.addColorStop(1, 'rgba(217,104,32,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }

      // פרספקטיבה בתצפית מעיני הדג: קרוב = גדול, רחוק = קטן
      function withPersp(x, y, fn) {
        if (camMode !== 'fish') { fn(); return; }
        const d = Math.hypot(x - player.x, y - player.y);
        const sc = clamp(1.2 - d / 500, 0.5, 1.2);
        ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-x, -y);
        fn();
        ctx.restore();
      }

      function render() {
        drawWater();
        ctx.save();
        if (camMode === 'fish') {
          // תצפית מעיני הדג: סיבוב כך שכיוון התנועה = למעלה
          const phi = -Math.PI / 2 - player.heading;
          ctx.translate(W / 2, H / 2);
          ctx.rotate(phi);
          ctx.translate(-player.x, -player.y);
        }
        drawSand();
        for (const p of pebbles) withPersp(p.x, p.y, () => { ctx.globalAlpha = fogOf(p.x, p.y); drawPebble(p); });
        for (const s of seaweeds) withPersp(s.x, H - 14, () => { ctx.globalAlpha = fogOf(s.x, H - 14); drawSeaweed(s); });
        for (const b of bubbles) withPersp(b.x, b.y, () => { ctx.globalAlpha = fogOf(b.x, b.y); drawBubble(b); });
        for (const f of foods) withPersp(f.x, f.y, () => { ctx.globalAlpha = fogOf(f.x, f.y); drawFood(f); });
        for (const c of coins) withPersp(c.x, c.y, () => drawCoin(c, fogOf(c.x, c.y)));
        for (const h of hazards) withPersp(h.x, h.y, () => { ctx.globalAlpha = fogOf(h.x, h.y); drawHazard(h); });
        ctx.globalAlpha = 1;
        if (camMode !== 'fish') drawFish(player); // בתצפית מעיני הדג הדג עצמו נעלם
        for (const p of particles) drawParticle(p);
        ctx.restore();
        if (camMode === 'fish') { drawSnow(); drawVignette(); drawSnout(); }
      }

      function loop(now) {
        if (!running) return;
        const dt = Math.min(now - lastTime, 50); lastTime = now; t += dt;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      function endGame() {
        running = false;
        overlayTitle.textContent = 'סוף המשחק! 🐟';
        overlayMsg.innerHTML = 'הניקוד שלך: <b>' + score + '</b> אוכלים 🍤<br>נסה שוב לשבור את השיא!';
        startBtn.textContent = 'שחק שוב';
        overlay.classList.remove('hidden');
        updateHint();
      }

      function startGame() {
        setup();
        overlay.classList.add('hidden');
        running = true; lastTime = performance.now(); t = 0;
        updateHint();
        requestAnimationFrame(loop);
      }

      /* קלט */
      function setPointer(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = clientX - rect.left;
        pointer.y = clientY - rect.top;
      }
      function onPress(clientX, clientY) {
        if (!running) return;
        if (camMode === 'full') { toggleCam(); return; } // כל לחיצה הופכת לדג
        const rect = canvas.getBoundingClientRect();
        const sx = clientX - rect.left, sy = clientY - rect.top;
        if (Math.hypot(sx - W / 2, sy - H / 2) < 52) { toggleCam(); return; } // לחיצה במרכז = יציאה
        setPointer(clientX, clientY);
      }

      canvas.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
      canvas.addEventListener('mousedown', e => onPress(e.clientX, e.clientY));
      canvas.addEventListener('touchstart', e => { e.preventDefault(); const tch = e.touches[0]; onPress(tch.clientX, tch.clientY); }, { passive: false });
      canvas.addEventListener('touchmove', e => { e.preventDefault(); const tch = e.touches[0]; setPointer(tch.clientX, tch.clientY); }, { passive: false });

      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', startGame);
      window.addEventListener('resize', () => { if (running) resize(); });

      /* אתחול */
      setup();
      render();
    })();
  </script>
</body>
</html>
